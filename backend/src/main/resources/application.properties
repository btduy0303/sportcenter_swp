spring.application.name=backend

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scms_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

# QUAN TRỌNG: Dùng 'validate' thay vì 'update' vì schema có PostgreSQL Triggers
# và EXCLUDE USING gist(...) mà Hibernate không tự tạo được.
# Chạy toàn bộ SQL script vào PostgreSQL một lần trước khi khởi động ứng dụng.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

swp391.khoa.bimat=${JWT_SECRET}

swp391.thoigian.song=${JWT_EXPIRATION:2592000000}

logging.level.org.springframework.security=DEBUG